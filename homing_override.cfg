[force_move]
enable_force_move: true

[homing_override]
axes: xyz
gcode:
  { action_respond_info("Homing requested: %s" % params) }

  # ── Configuration ─────────────────────────────────────────────────────────
  {% set cfg = {
    'bed_x'         : 300,
    'bed_y'         : 300,
    'z_endstop_x'   : 213.85,
    'z_endstop_y'   : 302.5,
    'travel_speed'  : 15000,
    'z_hop_height'  : 5,
    'z_hop_speed'   : 1200,
    'backoff_xy'    : 5,
    'backoff_speed' : 3000,
    'drag_chain_clearance' : 20,
  } %}

  # ── State snapshot ────────────────────────────────────────────────────────
  {% set home_all   = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set was_homed  = printer.toolhead.homed_axes %}
  { action_respond_info("Previously homed axes: %s" % was_homed) }

  # ── Safe Z-hop before touching kinematics ─────────────────────────────────
  {% if 'z' not in was_homed %}
    SET_KINEMATIC_POSITION SET_HOMED=Z Z=0
  {% endif %}
  G91
  G0 Z{cfg.z_hop_height} F{cfg.z_hop_speed}
  G90

  # Restore homed-axis state after clearing kinematics
  SET_KINEMATIC_POSITION CLEAR_HOMED=XYZ
  {% if was_homed %}
    SET_KINEMATIC_POSITION SET_HOMED={was_homed}
  {% endif %}
  M400

  # ── Macros ────────────────────────────────────────────────────────────────

  # Move Y away from the rear if needed, then home X with a backoff + retry
  {% macro home_x() %}
    {% if 'y' in printer.toolhead.homed_axes %}
      {% if printer.toolhead.position.y > cfg.bed_y - cfg.drag_chain_clearance %}
        G90
        G0 Y{cfg.bed_y - cfg.drag_chain_clearance} F{cfg.travel_speed}
      {% endif %}
    {% else %}
      # Y unknown — nudge forward using a temporary kinematic position
      SET_KINEMATIC_POSITION SET_HOMED=Y Y={cfg.bed_y * 0.5}
      G91
      G1 Y-{cfg.drag_chain_clearance} F3000
      G90
      SET_KINEMATIC_POSITION CLEAR_HOMED=XYZ
      {% if was_homed %}
        SET_KINEMATIC_POSITION SET_HOMED={was_homed}
      {% endif %}
    {% endif %}
    M400
    G28 X
    G91
    G1 X-{cfg.backoff_xy} F{cfg.backoff_speed}
    G90
    M400
    G28 X  # Second pass for accuracy
  {% endmacro %}

  # Home Y with a backoff + retry (requires X already homed)
  {% macro home_y() %}
    G28 Y
    G91
    G1 Y-{cfg.backoff_xy} F{cfg.backoff_speed}
    G90
    M400
    G28 Y  # Second pass for accuracy
  {% endmacro %}

  # ── Home X only ───────────────────────────────────────────────────────────
  {% if 'X' in params %}
    { home_x() }
  {% endif %}

  # ── Home Y only ───────────────────────────────────────────────────────────
  {% if 'Y' in params %}
    {% if 'x' not in printer.toolhead.homed_axes or
          printer.toolhead.position.x < cfg.bed_x - 20 %}
      { home_x() }
    {% endif %}
    { home_y() }
  {% endif %}

  # ── Home Z (or home all) ──────────────────────────────────────────────────
  {% if 'Z' in params or home_all %}

    {% if 'x' not in printer.toolhead.homed_axes or home_all %}
      { home_x() }
    {% endif %}

    {% if 'y' not in printer.toolhead.homed_axes or home_all %}
      { home_y() }
    {% endif %}

    # Clear Y if too close to the rear before moving to Z-endstop
    {% if printer.toolhead.position.y > cfg.bed_y - 2*cfg.drag_chain_clearance and
          printer.toolhead.position.x != cfg.z_endstop_x or home_all %}
      G0 Y{cfg.bed_y - 2*cfg.drag_chain_clearance} F{cfg.travel_speed}
    {% endif %}

    M400
    G0 X{cfg.z_endstop_x} Y{cfg.z_endstop_y} F{cfg.travel_speed}
    G28 Z
    G91
    G0 Z10
  {% endif %}

  G90  # Absolute positioning