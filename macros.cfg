#####################################################################
# 	Macros
#####################################################################

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    STATUS_HOMING
    G28
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    STATUS_HOMING
    G28 Z
    G90 ; Set to Absolute Positioning
    ; park at the same height Z homing ends at (safe_z_home z_hop), so the
    ; mesh scan that usually follows starts without a pointless descent
    G0 X150 Y150 Z{printer.configfile.settings.safe_z_home.z_hop} F10000 ; Park over bed center
    STATUS_READY

[gcode_macro PRINT_START]
gcode:
   # Use default values if the slicer doesn't pass them
   {% set BED_TEMP = params.BED|default(100)|float %}
   {% set EXTRUDER_TEMP = params.EXTRUDER|default(220)|float %}
   {% set TAP_TEMP = 150 %} ; softens ooze stuck on the nozzle without making it ooze more

   # Homing state and QGL 'applied' are both cleared whenever the steppers are
   # disabled, so this is true only if the motors have stayed on since the last G32
   {% set already_leveled = 'xyz' in printer.toolhead.homed_axes
                            and printer.quad_gantry_level.applied %}

   # Until the frame is heat-soaked it is still expanding, so a QGL and mesh
   # from an earlier print in the session are already stale. SOAK_TICK counts
   # minutes the bed has been at printing temperature (keep-warm between
   # prints counts); only a soaked printer may skip the full prep.
   {% set SOAK_MINUTES = 45 %}
   {% set soaked = printer["gcode_macro _SOAK_STATE"].minutes >= SOAK_MINUTES %}

   SET_GCODE_VARIABLE MACRO=PRINT_END VARIABLE=bed_temp VALUE={BED_TEMP} ; remember for PRINT_END
   UPDATE_DELAYED_GCODE ID=RESTORE_KEEP_WARM DURATION=0 ; cancel any pending keep-warm restore

   G90 ; Use absolute positioning
#   M204 P1500.00 R1000.00 T1500.00 ; Setup Print/Retract/Travel acceleration
#   M220 S100 ; Reset Feedrate
#   M221 S100 ; Reset Flowrate
   M140 S{BED_TEMP} ; start preheating the bed WITHOUT wait

   {% if already_leveled and soaked %}
     M104 S{EXTRUDER_TEMP} T0 ; no tapping needed, go straight to print temp
   {% else %}
     M104 S{TAP_TEMP} T0 ; tap temp only, so the nozzle doesn't ooze onto the plate
     STATUS_HEATING
     _HEAT_WAIT HEATER=heater_bed TARGET={BED_TEMP} ; wait for the bed so QGL happens on a thermally expanded frame
     ; Taps only work near tap temp: colder ooze is too hard to squish out of the way,
     ; and far above it the molten ooze cushions the contact so the probe never
     ; triggers ("No trigger on probe after full movement" -> print auto-cancels).
     ; ABOVE_OK: within a small overshoot of tap temp, tap right away without
     ; waiting. Checked inside _HEAT_WAIT at execution time - a template-time
     ; check here would see the pre-heat temp and wait even for PID overshoot.
     _HEAT_WAIT HEATER=extruder TARGET={TAP_TEMP} ABOVE_OK=30
     M117 Leveling gantry
     G32 ; Home and QGL at tap temp (see G32 macro above)
     STATUS_MESHING
     M117 Scanning bed mesh
     BED_MESH_CALIBRATE ; scan still at tap temp: heating mid-scan drifts the eddy readings and skews the mesh
     M104 S{EXTRUDER_TEMP} T0 ; climb towards print temp during the travel to the purge line
   {% endif %}

   G1 X15.1 Y150 Z10 F10000 ; heat up over the prime line, keeping ooze off the print area
   STATUS_HEATING
   _HEAT_WAIT HEATER=heater_bed TARGET={BED_TEMP} ; no-op if already at temp from the QGL branch
   _HEAT_WAIT HEATER=extruder TARGET={EXTRUDER_TEMP} ; WAIT for final hotend temp
   STATUS_PRINTING
   M117
   G92 E0 ; Reset Extruder
   ; Draw the purge line without mesh compensation: X15 is the flaky far edge of the
   ; eddy mesh and compensation there drove the nozzle into the bed
   BED_MESH_CLEAR
   G1 X15.1 Y150 Z0.28 F5000.0 ; Move to start position
   G1 E15 F1200 ; Recover 15 of the 20mm retracted at print end
   G92 E0 ; Reset Extruder
   G1 X15.1 Y20.0 Z0.28 F1500.0 E15 ; Draw the first line
   G1 X15.4 Y20.0 Z0.28 F5000.0 ; Move to side a little
   G1 X15.4 Y150 Z0.28 F1500.0 E30 ; Draw the second line
  # G92 E0 ; Reset Extruder
  # Z_TEST_SQUARE
  # G1 E-2 F1200 ; Retract
   G1 Z0.4 F3000 ; Move Z Axis up only a little
   G92 E0 ; Reset Extruder
   _RELOAD_MESH ; re-activate the mesh for the actual print
   G0 F21000 ; Move quickly (350 mm/s) to the starting point to avoid oozing

# Helper: evaluated when executed (not when PRINT_START's template renders),
# so it sees the profile that the scan earlier in the same print created
[gcode_macro _RELOAD_MESH]
gcode:
   {% if 'default' in printer.bed_mesh.profiles %}
     BED_MESH_PROFILE LOAD=default
   {% endif %}
 
# Sets a heater target and waits for it like M190/M109 do, but shows progress.
# A plain M190/M109 holds Klipper's gcode queue for the whole wait, so nothing
# else (console, delayed_gcode, M117 from a timer) can touch the display until
# it finishes -- a timer-based progress updater just queues up behind it.
# Instead the wait is unrolled into ~5 degree TEMPERATURE_WAIT chunks with an
# in-stream M117 progress bar between chunks: ██████░░░░ 60% Bed 76/110
# The template renders once at call time (live temp -> chunk thresholds are
# fixed then), and each M117 executes as its chunk is reached. Handles cooldown
# waits too (e.g. nozzle dropping to tap temp).
[gcode_macro _HEAT_WAIT]
gcode:
   {% set heater = params.HEATER|default("heater_bed") %}
   {% set target = params.TARGET|float %}
   {% set above_ok = params.ABOVE_OK|default(0)|float %}
   {% set label = "Bed" if heater == "heater_bed" else "Nozzle" %}
   {% set cur = printer[heater].temperature %}
   {% set diff = target - cur %}
   {% if heater == "heater_bed" %}
     M140 S{target}
   {% else %}
     M104 S{target}
   {% endif %}
   {% if diff < 0 and diff|abs <= above_ok %}
     ; already within the acceptable overshoot window - no cooldown wait
   {% elif diff|abs >= 2 %}
     {% set steps = [[(diff|abs / 5)|round(0, 'ceil')|int, 20]|min, 1]|max %}
     {% for i in range(1, steps + 1) %}
       {% set from_t = cur + diff * (i - 1) / steps %}
       {% if diff > 0 and target > 26 %}
         ; heating percent measured from 25C ambient, so a warm start shows
         ; e.g. 63->100 instead of restarting at 0 (KlipperScreen matches)
         {% set pct = (100 * (from_t - 25) / (target - 25))|int %}
       {% else %}
         {% set pct = (100 * (i - 1) / steps)|int %}
       {% endif %}
       {% set pct = [[pct, 0]|max, 99]|min %}
       {% set filled = pct // 10 %}
       M117 {"█" * filled}{"░" * (10 - filled)} {pct}% {label} {from_t|int}/{target|int}
       {% if i < steps %}
         TEMPERATURE_WAIT SENSOR={heater} {"MINIMUM" if diff > 0 else "MAXIMUM"}={cur + diff * i / steps}
       {% else %}
         ; final chunk uses the same +-1 settle window as M190/M109, so PID
         ; hovering just shy of the target can't stall the last step
         TEMPERATURE_WAIT SENSOR={heater} {"MINIMUM" if diff > 0 else "MAXIMUM"}={target - 1 if diff > 0 else target + 1}
       {% endif %}
     {% endfor %}
   {% endif %}
   M117 ██████████ 100% {label} {target|int}

[gcode_macro PRINT_END]
variable_bed_temp: 0 ; set by PRINT_START
gcode:
   # Keep the bed at the temp this print used. Don't trust the current target:
   # the slicer may have issued its own M140 S0 before PRINT_END runs.
   {% set BED_TEMP = params.BED|default(bed_temp if bed_temp else printer.heater_bed.target)|float %}

   G91 ; relative movements
   G1 E-20 F1200 ; Retract
   G1 Z5 F5000 ; lift nozzle
   G90 ; back to absolute
   G0 X280 Y280 F10000
   M107 ; turn fan off
   M104 S150 ; keep the nozzle warm for a quick next start
   M140 S{BED_TEMP} ; keep the bed on (idle_timeout turns it off after 30 min)
   UPDATE_DELAYED_GCODE ID=RESTORE_KEEP_WARM DURATION=5 ; re-apply after the slicer's trailing cooldown
   STATUS_READY

# Cura appends its own M104 S0 after the end gcode no matter what is in it, which
# would defeat the keep-warm above. Re-apply the targets once that line has run.
[delayed_gcode RESTORE_KEEP_WARM]
gcode:
   M104 S150
   M140 S{printer["gcode_macro PRINT_END"].bed_temp}


# PAUSE / RESUME / CANCEL_PRINT are provided by mainsail.cfg; this macro configures them.
# cancel_retract matches PRINT_END's 20mm so PRINT_START's 15mm recovery stays valid,
# and cancelling parks at the same rear-right corner as PRINT_END.
[gcode_macro _CLIENT_VARIABLE]
variable_cancel_retract: 20.0
variable_park_at_cancel: True
variable_park_at_cancel_x: 280
variable_park_at_cancel_y: 280
# Park PAUSE at the same rear-right spot as PRINT_END/cancel; the default
# (5mm from both maxes) makes the printhead hit the side of the printer
variable_use_custom_pos: True
variable_custom_park_x: 280
variable_custom_park_y: 280
gcode:

[gcode_macro ZUP]
gcode:
    SET_GCODE_OFFSET Z_ADJUST=0.01 MOVE=1

[gcode_macro ZDOWN]
gcode:
    SET_GCODE_OFFSET Z_ADJUST=-0.01 MOVE=1

# Filament change helpers for the glance PAUSED screen (also usable from
# Mainsail). Distances suit the Clockwork2/Stealthburner filament path;
# both refuse politely below min_extrude_temp. RESUME restores the gcode
# state saved at PAUSE, so the M83 here doesn't leak into the print.
[gcode_macro UNLOAD_FILAMENT]
gcode:
   {% if printer.extruder.can_extrude %}
     M83 ; relative extruder
     G1 E5 F300 ; soften the tip so it pulls a clean point
     G1 E-80 F1800 ; pull clear of the extruder
     G92 E0
   {% else %}
     {action_respond_info("Nozzle too cold to unload - heat it first")}
   {% endif %}

[gcode_macro LOAD_FILAMENT]
gcode:
   {% if printer.extruder.can_extrude %}
     M83 ; relative extruder
     G1 E50 F300 ; feed down to the meltzone
     G1 E25 F150 ; slow purge to prime
     G92 E0
   {% else %}
     {action_respond_info("Nozzle too cold to load - heat it first")}
   {% endif %}


# Heat-soak bookkeeping for PRINT_START: counts minutes the bed has been at a
# printing temperature (target >= 60 and within 5 deg of it). Bed off resets
# the count. Restarting Klipper also resets it, which errs on the safe side
# (the next print re-levels and re-meshes).
[gcode_macro _SOAK_STATE]
variable_minutes: 0
gcode:
   RESPOND MSG="Heat soak: {printer['gcode_macro _SOAK_STATE'].minutes} min"

[delayed_gcode SOAK_TICK]
initial_duration: 60
gcode:
   {% set st = printer["gcode_macro _SOAK_STATE"] %}
   {% set bed = printer.heater_bed %}
   {% if bed.target >= 60 and bed.temperature > bed.target - 5 %}
     SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=minutes VALUE={st.minutes + 1}
   {% elif bed.target < 60 %}
     SET_GCODE_VARIABLE MACRO=_SOAK_STATE VARIABLE=minutes VALUE=0
   {% endif %}
   UPDATE_DELAYED_GCODE ID=SOAK_TICK DURATION=60
