#####################################################################
# 	Macros
#####################################################################

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    ##	Uncomment for for your size printer:
    #--------------------------------------------------------------------
    ##	Uncomment for 250mm build
    # G0 X125 Y125 Z30 F3600
    
    ##	Uncomment for 300 build
    G90 ; Set to Absolute Positioning
    G0 X150 Y150 Z30 F10000
    
    ##	Uncomment for 350mm build
    #G0 X175 Y175 Z30 F3600
    #--------------------------------------------------------------------
   
#[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
#gcode:
#    G32                            ; home all axes
#    G1 Z20 F3000                   ; move nozzle away from bed
   

#[gcode_macro PRINT_END]
##   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
#gcode:
#    M400                           ; wait for buffer to clear
#    G92 E0                         ; zero the extruder
#    G1 E-10.0 F3600                ; retract filament
#    G91                            ; relative positioning
#    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
#    TURN_OFF_HEATERS
#    M107                           ; turn off fan
#    G1 Z2 F3000                    ; move nozzle up 2mm
#    G90                            ; absolute positioning
#    G0  X125 Y250 F3600            ; park nozzle at rear
#    BED_MESH_CLEAR

[gcode_macro PRINT_START]
gcode:
   # Use default values if the slicer doesn't pass them
   {% set BED_TEMP = params.BED|default(100)|float %}
   {% set EXTRUDER_TEMP = params.EXTRUDER|default(220)|float %}

   G90 ; Use absolute positioning
#   M204 P1500.00 R1000.00 T1500.00 ; Setup Print/Retract/Travel acceleration
#   M220 S100 ; Reset Feedrate
#   M221 S100 ; Reset Flowrate
   M140 S{BED_TEMP} ; start preheating the bed WITHOUT wait to what is set in Cura
   M104 S{EXTRUDER_TEMP} T0 ; start preheating hotend WITHOUT wait to what is set in Cura
   G32 ; Home and QGL (see G32 macro above)
   M190 S{BED_TEMP} ; start heating the bed to what is set in Cura and WAIT
   M109 S{EXTRUDER_TEMP} T0 ; start heating hotend to what is set in Cura and WAIT
   G92 E0 ; Reset Extruder
   ; G1 Z0.3 F3000 ; Move Z Axis up
   G1 X15.1 Y150 Z0.28 F5000.0 ; Move to start position
   G1 X15.1 Y20.0 Z0.28 F1500.0 E15 ; Draw the first line
   G1 X15.4 Y20.0 Z0.28 F5000.0 ; Move to side a little
   G1 X15.4 Y150 Z0.28 F1500.0 E30 ; Draw the second line
  # G92 E0 ; Reset Extruder
  # Z_TEST_SQUARE
  # G1 E-2 F1200 ; Retract
   G1 Z0.4 F3000 ; Move Z Axis up only a little
   G92 E0 ; Reset Extruder
   G0 F21000 ; Move quickly (350 mm/s) to the starting point to avoid oozing
 
[gcode_macro PRINT_END]
gcode:
   # Use default values if the slicer doesn't pass them
   {% set BED_TEMP = params.BED|default(95)|float %}

   G91 ; relative movements
   G1 E-10 F1200 ; Retract
   G1 Z5 F5000 ; lift nozzle
   G90 ; back to absolute
   G0 X280 Y280 F10000
   M107 ; turn fan off
   M104 S0 ; turn off extruder
   M140 S{BED_TEMP} ; keep the bed on


[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE


[gcode_macro ZUP]
gcode:
    SET_GCODE_OFFSET Z_ADJUST=0.01 MOVE=1

[gcode_macro ZDOWN]
gcode:
    SET_GCODE_OFFSET Z_ADJUST=-0.01 MOVE=1
