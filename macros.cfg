#####################################################################
# 	Macros
#####################################################################

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    STATUS_HOMING
    G28
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL
    STATUS_HOMING
    G28 Z
    G90 ; Set to Absolute Positioning
    G0 X150 Y150 Z30 F10000 ; Park over bed center
    STATUS_READY

[gcode_macro PRINT_START]
gcode:
   # Use default values if the slicer doesn't pass them
   {% set BED_TEMP = params.BED|default(100)|float %}
   {% set EXTRUDER_TEMP = params.EXTRUDER|default(220)|float %}
   {% set TAP_TEMP = 150 %} ; softens ooze stuck on the nozzle without making it ooze more

   # Homing state and QGL 'applied' are both cleared whenever the steppers are
   # disabled, so this is true only if the motors have stayed on since the last G32
   {% set already_leveled = 'xyz' in printer.toolhead.homed_axes
                            and printer.quad_gantry_level.applied %}

   SET_GCODE_VARIABLE MACRO=PRINT_END VARIABLE=bed_temp VALUE={BED_TEMP} ; remember for PRINT_END

   G90 ; Use absolute positioning
#   M204 P1500.00 R1000.00 T1500.00 ; Setup Print/Retract/Travel acceleration
#   M220 S100 ; Reset Feedrate
#   M221 S100 ; Reset Flowrate
   M140 S{BED_TEMP} ; start preheating the bed WITHOUT wait

   {% if already_leveled %}
     M104 S{EXTRUDER_TEMP} T0 ; no tapping needed, go straight to print temp
   {% else %}
     M104 S{TAP_TEMP} T0 ; tap temp only, so the nozzle doesn't ooze onto the plate
     STATUS_HEATING
     M190 S{BED_TEMP} ; wait for the bed so QGL happens on a thermally expanded frame
     ; Taps only work near tap temp: colder ooze is too hard to squish out of the way,
     ; and far above it the molten ooze cushions the contact so the probe never
     ; triggers ("No trigger on probe after full movement" -> print auto-cancels).
     ; Within a small overshoot of tap temp, tap right away without waiting.
     {% if printer.extruder.temperature < TAP_TEMP or printer.extruder.temperature > TAP_TEMP + 30 %}
       M109 S{TAP_TEMP} T0
     {% endif %}
     G32 ; Home and QGL at tap temp (see G32 macro above)
     M104 S{EXTRUDER_TEMP} T0 ; climb towards print temp during the contactless mesh scan
     STATUS_MESHING
     BED_MESH_CALIBRATE ; rapid eddy scan of a fresh mesh (see bigtreetech-eddy.cfg)
   {% endif %}

   G1 X15.1 Y150 Z10 F10000 ; heat up over the prime line, keeping ooze off the print area
   STATUS_HEATING
   M190 S{BED_TEMP} ; WAIT for bed (no-op if already reached above)
   M109 S{EXTRUDER_TEMP} T0 ; WAIT for final hotend temp
   STATUS_PRINTING
   G92 E0 ; Reset Extruder
   ; G1 Z0.3 F3000 ; Move Z Axis up
   G1 X15.1 Y150 Z0.28 F5000.0 ; Move to start position
   G1 E15 F1200 ; Recover 15 of the 20mm retracted at print end
   G92 E0 ; Reset Extruder
   G1 X15.1 Y20.0 Z0.28 F1500.0 E15 ; Draw the first line
   G1 X15.4 Y20.0 Z0.28 F5000.0 ; Move to side a little
   G1 X15.4 Y150 Z0.28 F1500.0 E30 ; Draw the second line
  # G92 E0 ; Reset Extruder
  # Z_TEST_SQUARE
  # G1 E-2 F1200 ; Retract
   G1 Z0.4 F3000 ; Move Z Axis up only a little
   G92 E0 ; Reset Extruder
   G0 F21000 ; Move quickly (350 mm/s) to the starting point to avoid oozing
 
[gcode_macro PRINT_END]
variable_bed_temp: 0 ; set by PRINT_START
gcode:
   # Keep the bed at the temp this print used. Don't trust the current target:
   # the slicer may have issued its own M140 S0 before PRINT_END runs.
   {% set BED_TEMP = params.BED|default(bed_temp if bed_temp else printer.heater_bed.target)|float %}

   G91 ; relative movements
   G1 E-20 F1200 ; Retract
   G1 Z5 F5000 ; lift nozzle
   G90 ; back to absolute
   G0 X280 Y280 F10000
   M107 ; turn fan off
   M104 S150 ; keep the nozzle warm for a quick next start
   M140 S{BED_TEMP} ; keep the bed on (idle_timeout turns it off after 30 min)
   STATUS_READY


# PAUSE / RESUME / CANCEL_PRINT are provided by mainsail.cfg; this macro configures them.
# cancel_retract matches PRINT_END's 20mm so PRINT_START's 15mm recovery stays valid,
# and cancelling parks at the same rear-right corner as PRINT_END.
[gcode_macro _CLIENT_VARIABLE]
variable_cancel_retract: 20.0
variable_park_at_cancel: True
variable_park_at_cancel_x: 280
variable_park_at_cancel_y: 280
# Park PAUSE at the same rear-right spot as PRINT_END/cancel; the default
# (5mm from both maxes) makes the printhead hit the side of the printer
variable_use_custom_pos: True
variable_custom_park_x: 280
variable_custom_park_y: 280
gcode:

[gcode_macro ZUP]
gcode:
    SET_GCODE_OFFSET Z_ADJUST=0.01 MOVE=1

[gcode_macro ZDOWN]
gcode:
    SET_GCODE_OFFSET Z_ADJUST=-0.01 MOVE=1
