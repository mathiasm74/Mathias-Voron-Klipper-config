[temperature_fan skirt_fan]
pin: PD12
max_power: 0.3
shutdown_speed: 0.0
kick_start_time: 0.0
sensor_type: temperature_host
control: watermark
max_delta: 4.0  # Turns on at 57°C, off again at 53°C
min_temp: 10
max_temp: 80
target_temp: 57.0

[temperature_fan toolhead_fan]
pin: EBBCan:gpio6
max_power: 0.7
shutdown_speed: 0.0
kick_start_time: 0.0
sensor_type: Generic 3950
sensor_pin: EBBCan:gpio28
control: watermark
max_delta: 4.0  # Turns on at 57°C, off again at 53°C
min_temp: 10
max_temp: 80
target_temp: 57.0



