[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
##	SSR Pin - BED_OUT
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
##	Adjust Max Power so your heater doesn't warp your bed
## 0.8 = ~0.67 W/cm2 on the 750W/300mm bed: faster heatup, transient bow
## is compensated by the post-heat QGL+mesh (soak-gated in macros.cfg)
max_power: 0.8
min_temp: 0
max_temp: 130
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
# 	Fan Control
#####################################################################
# Toolhead fans (part cooling, hotend, toolhead cooling) are in toolhead.cfg

[temperature_fan skirt_fan]
pin: PD12
max_power: 0.3
shutdown_speed: 0.0
kick_start_time: 0.0
sensor_type: temperature_host
control: watermark
max_delta: 4.0  # Turns on at 57°C, off again at 53°C
min_temp: 10
max_temp: 80
target_temp: 57.0
